# Rate limit dasar. IP asli diambil dari X-Forwarded-For hanya jika berasal
# dari proxy privat (mis. Nginx Proxy Manager di jaringan Docker/host).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=login_zone:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

limit_req_status 429;
limit_conn_status 429;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 15m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;

  location = /api/auth/login {
    limit_req zone=login_zone burst=30 nodelay;
    limit_conn perip 20;

    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Upload arsip restore bisa besar; jangan buffer seluruh body di Nginx.
  location = /api/system/restore {
    client_max_body_size 1024m;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    limit_req zone=api_zone burst=10 nodelay;
    limit_conn perip 5;

    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=api_zone burst=100 nodelay;
    limit_conn perip 200;

    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    limit_req zone=api_zone burst=100 nodelay;
    limit_conn perip 50;

    proxy_pass http://backend:3000/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # index.html tidak boleh di-cache agar deploy baru langsung terpakai.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # Asset Vite memakai hash di nama file, aman di-cache lama.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
